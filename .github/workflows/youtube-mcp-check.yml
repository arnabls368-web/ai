name: YouTube MCP type check

on:
  pull_request:
    paths:
      - "demos/remote-mcp-google-oauth/**"
      - ".github/workflows/youtube-mcp-check.yml"
  push:
    branches:
      - feature/youtube-upload-mcp
    paths:
      - "demos/remote-mcp-google-oauth/**"
      - ".github/workflows/youtube-mcp-check.yml"

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile --filter remote-mcp-google-oauth...
      - name: Run TypeScript check
        run: pnpm --filter remote-mcp-google-oauth run type-check
      - name: Validate Cloudflare Worker bundle
        run: pnpm --filter remote-mcp-google-oauth exec wrangler deploy --dry-run

  upload-source-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos/remote-mcp-google-oauth
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run dependency-free upload source tests
        run: node --test src/*.test.mjs
