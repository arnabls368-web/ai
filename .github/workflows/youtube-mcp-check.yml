name: YouTube MCP type check

on:
  pull_request:
    paths:
      - "demos/remote-mcp-google-oauth/**"
      - ".github/workflows/youtube-mcp-check.yml"
  push:
    branches:
      - feature/youtube-upload-mcp
    paths:
      - "demos/remote-mcp-google-oauth/**"
      - ".github/workflows/youtube-mcp-check.yml"

jobs:
  type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos/remote-mcp-google-oauth
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run TypeScript check
        run: npm run type-check
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
