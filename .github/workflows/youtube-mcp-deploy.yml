name: Deploy NEXUS YouTube MCP to Cloudflare

on:
  # Production deployment is deliberately manual; pushes and PRs must never
  # publish a Worker without an explicit operator action.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # workflow_dispatch can be launched against a selected ref. Restrict the
    # production credential-bearing job to the default branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos/remote-mcp-google-oauth
    steps:
      - name: Check whether deployment credentials are configured
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment token is not configured; safely skipping deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: npm install --no-audit --no-fund

      - name: Deploy Worker with Wrangler
        if: steps.credentials.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0f115e51541a996bc777725456d89e11
        run: npx --yes wrangler@4.164.0 deploy

      - name: Report missing deployment credential
        if: steps.credentials.outputs.configured != 'true'
        working-directory: .
        run: echo "Deployment skipped. Add the CLOUDFLARE_API_TOKEN repository secret to enable deployment."
