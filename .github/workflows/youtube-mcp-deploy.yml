name: Deploy NEXUS YouTube MCP to Cloudflare

on:
  # Production deployment is deliberately manual; pushes and PRs must never
  # publish a Worker without an explicit operator action.
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "I explicitly approve deploying the reviewed NEXUS Worker to production"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  deploy:
    # workflow_dispatch can be launched against a selected ref. Restrict the
    # production credential-bearing job to the default branch.
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos/remote-mcp-google-oauth
    steps:
      - name: Check whether deployment credentials are configured
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment token is not configured; safely skipping deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        if: steps.credentials.outputs.configured == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen workspace dependencies
        if: steps.credentials.outputs.configured == 'true'
        working-directory: .
        run: pnpm install --frozen-lockfile --child-concurrency=10

      - name: Deploy Worker with the lockfile-pinned Wrangler
        if: steps.credentials.outputs.configured == 'true'
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0f115e51541a996bc777725456d89e11
        run: pnpm exec wrangler deploy

      - name: Report missing deployment credential
        if: steps.credentials.outputs.configured != 'true'
        working-directory: .
        run: echo "Deployment skipped. Add the CLOUDFLARE_API_TOKEN repository secret to enable deployment."
