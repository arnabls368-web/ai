name: CI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    actions: write
    contents: read
    pull-requests: write

jobs:
    main:
        runs-on: ubuntu-latest
        env:
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24
                  cache: "pnpm"

            # Restore the cached .nx folder (if it exists)
            - name: Restore Nx cache
              id: nx-cache
              uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
              with:
                  path: .nx
                  key: nx-cache-${{ runner.os }}-${{ hashFiles('**/nx.json') }}
                  restore-keys: |
                      nx-cache-${{ runner.os }}-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --child-concurrency=10

            - name: Install uv for Python
              uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
              with:
                  version: "0.9.3"
                  enable-cache: false

            - name: Format and lint everything
              run: |
                  pnpm format
                  pnpm lint

            - name: Set Nx SHAs
              uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4

            - name: Run Nx tasks
              id: checks
              run: pnpm nx affected -t lint test:ci type-check build

            - name: Cache Nx folder
              uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
              with:
                  path: .nx
                  key: nx-cache-${{ runner.os }}-${{ hashFiles('**/nx.json') }}
                  restore-keys: |
                      nx-cache-${{ runner.os }}-
