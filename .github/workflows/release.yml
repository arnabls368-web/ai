name: Release

on:
    push:
        branches:
            - main

jobs:
    release:
        permissions:
            id-token: write # Required for OIDC
            contents: write
            pull-requests: write

        if: ${{ github.repository_owner == 'cloudflare' }}
        timeout-minutes: 5
        runs-on: ubuntu-22.04

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 1

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile --child-concurrency=10

            - name: Test and Build
              run: |
                  pnpm nx build workers-ai-provider
                  pnpm nx build ai-gateway-provider
                  pnpm nx build ai-search-provider
                  pnpm nx build @cloudflare/tanstack-ai

            - id: changesets
              uses: changesets/action@06245a4e0a36c064a573d4150030f5ec548e4fcc # v1
              with:
                  version: ./.github/version-and-install.sh
                  publish: pnpm changeset publish
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true
