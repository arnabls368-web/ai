name: Smoke Tests

on:
    schedule:
        # Run the workflow every day at midnight UTC
        - cron: "0 0 * * *"
    workflow_dispatch: # Allow manual triggering of the workflow

jobs:
    main:
        runs-on: ubuntu-latest
        env:
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        steps:
            # Checkout the repository
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

            # Set up Node.js with caching for pnpm dependencies
            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24
                  cache: "pnpm"

            # Install dependencies
            - name: Install dependencies
              run: pnpm install --frozen-lockfile --child-concurrency=10

            # Set commit shas for Nx if needed
            - name: Set Nx SHAs
              uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4

            # Run Nx tasks including the staging deployment and extract the URL.
            - name: Run smoke tests
              id: checks
              run: pnpm nx run-many -t test:smoke
