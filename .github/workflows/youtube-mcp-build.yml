name: Build YouTube MCP deployment bundle

on:
  pull_request:
    paths:
      - "demos/remote-mcp-google-oauth/**"
      - ".github/workflows/youtube-mcp-build.yml"
  push:
    branches:
      - feature/youtube-upload-mcp
    paths:
      - "demos/remote-mcp-google-oauth/**"
      - ".github/workflows/youtube-mcp-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos/remote-mcp-google-oauth
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build deployable Worker bundle
        run: npx wrangler deploy --dry-run --outdir worker-build
      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: nexus-youtube-mcp-worker
          path: demos/remote-mcp-google-oauth/worker-build/
          if-no-files-found: error
          retention-days: 3
