name: Build YouTube MCP deployment bundle

on:
  pull_request:
    paths:
      - "demos/remote-mcp-google-oauth/**"
      - ".github/workflows/youtube-mcp-build.yml"
  push:
    branches:
      - feature/youtube-upload-mcp
    paths:
      - "demos/remote-mcp-google-oauth/**"
      - ".github/workflows/youtube-mcp-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile --filter remote-mcp-google-oauth...
      - name: Build deployable Worker bundle
        run: pnpm --filter remote-mcp-google-oauth exec wrangler deploy --dry-run --outdir worker-build
      - name: Upload deployment bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexus-youtube-mcp-worker
          path: demos/remote-mcp-google-oauth/worker-build/
          if-no-files-found: error
          retention-days: 3
