name = "phn-youtube-mcp"
main = "src/index.ts"
compatibility_date = "2026-11-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[vars]
MCP_RESOURCE = "https://phn-youtube-mcp.arnab368.workers.dev/mcp"
HOSTED_DOMAIN = ""
# Comma-separated exact hostnames permitted as external video URL sources.
YOUTUBE_UPLOAD_ALLOWED_HOSTS = ""

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "eec4880e350447e5a5ca3fb5b53d7322"

[[durable_objects.bindings]]
name = "OAUTH_STATE"
class_name = "OAuthStateDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OAuthStateDO"]
